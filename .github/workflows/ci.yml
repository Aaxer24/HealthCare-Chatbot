name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # Builds the Docker image, pushes it to GitHub Container Registry (GHCR --
  # no extra registry account needed, authenticates with the workflow's own
  # built-in token), then SSHes into the EC2 instance to pull and restart the
  # container, on every push to main once tests pass.
  #
  # One-time setup required before this job can succeed:
  #   1. An EC2 instance (Ubuntu) with Docker installed -- see README.
  #   2. Its security group allows inbound 22 (SSH), 80 (HTTP) and 443 (HTTPS).
  #   3. Six repo secrets (Settings -> Secrets and variables -> Actions):
  #        EC2_HOST              -- the instance's public IP
  #        EC2_USER              -- ubuntu (or ec2-user for Amazon Linux)
  #        EC2_SSH_KEY           -- the full contents of the instance's private key
  #        GROQ_API_KEY          -- passed through to the running container, and used
  #                                 by the eval-gate step below to call the live model
  #        AWS_ACCESS_KEY_ID     -- for the DVC S3 remote (data/vectorstore versioning)
  #        AWS_SECRET_ACCESS_KEY -- see README (Data & Experiment Versioning) for scoping options
  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies (app + eval + dvc)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install -r requirements-eval.txt
          pip install "dvc[s3]"

      # The vectorstore is DVC-tracked (see data.dvc / vectorstore/db_faiss.dvc),
      # not committed to git directly -- pull the real index bytes from the S3
      # remote before the eval-gate and the Docker build both need them.
      - name: Pull vector store from DVC remote
        run: |
          dvc pull vectorstore/db_faiss
          if [ ! -f vectorstore/db_faiss/index.faiss ]; then
            echo "::error::vectorstore/db_faiss/index.faiss is missing after dvc pull."
            echo "::error::Rebuild it locally (python create_memory_for_llm.py), then 'dvc add vectorstore/db_faiss && dvc push' before pushing -- the Docker image bakes in whatever dvc pull retrieves, it does not regenerate it at build time."
            exit 1
          fi

      # Regression gate: run a fast, cheap subset of the golden set through the
      # live pipeline and fail the build if quality drops below the floor in
      # eval/check_thresholds.py.
      #
      # --limit and --metrics both exist to protect Groq's free-tier *daily*
      # token quota (200K tokens/day, shared with the deployed app on the same
      # key) -- not just its per-minute limit. context_precision/context_recall
      # call the judge once per retrieved chunk (5x the calls of the other two
      # with rerank_k=5) and are dropped here entirely; --limit 6 keeps the
      # question count small. Exhausting the daily quota in CI would also
      # start failing real chat requests on the live app, since it shares this
      # same GROQ_API_KEY. Run the full golden set with all four metrics
      # locally for actual tuning (see eval/results/history.csv and MLflow).
      - name: RAGAS eval-gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python evaluate_chatbot.py --limit 6 --metrics faithfulness,answer_relevancy
          python eval/check_thresholds.py eval/results/summary.json --metrics faithfulness,answer_relevancy

      # GHCR image names must be lowercase; the GitHub repo/owner name here
      # has uppercase letters, so this can't just be interpolated directly.
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSHes into the instance and does a simple pull-and-restart: stop and
      # remove whatever's currently running under this container name (if
      # anything), pull the freshly-pushed image, start it again.
      #
      # The app binds 127.0.0.1:8080 (loopback only), NOT port 80: a Caddy
      # container owns ports 80/443 on the host and reverse-proxies to it,
      # terminating HTTPS with an automatically-renewed Let's Encrypt cert
      # for healthcare-chatbot.duckdns.org (see README, Deployment). Do not
      # change this back to -p 80:8080 -- that port is taken, and the deploy
      # would fail with "port is already allocated". Caddy is long-lived and
      # deliberately not touched by this workflow. --restart unless-stopped
      # brings the app back automatically if the instance itself reboots.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ steps.image.outputs.name }}:latest
            docker stop healthcare-chatbot 2>/dev/null || true
            docker rm healthcare-chatbot 2>/dev/null || true
            docker run -d \
              --name healthcare-chatbot \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
              ${{ steps.image.outputs.name }}:latest
            docker image prune -f
