name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # Builds + pushes to GHCR, then SSHes into EC2 to pull and restart.
  # Needs: EC2 instance with Docker (ports 22/80/443 open), and repo secrets
  # EC2_HOST, EC2_USER, EC2_SSH_KEY, GROQ_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies (app + eval + dvc)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install -r requirements-eval.txt
          pip install "dvc[s3]"

      # vectorstore is DVC-tracked, not committed directly -- pull it before eval-gate/build need it
      - name: Pull vector store from DVC remote
        run: |
          dvc pull vectorstore/db_faiss
          if [ ! -f vectorstore/db_faiss/index.faiss ]; then
            echo "::error::vectorstore/db_faiss/index.faiss is missing after dvc pull."
            echo "::error::Rebuild it locally (python create_memory_for_llm.py), then 'dvc add vectorstore/db_faiss && dvc push' before pushing -- the Docker image bakes in whatever dvc pull retrieves, it does not regenerate it at build time."
            exit 1
          fi

      # Regression gate on a small subset -- kept cheap since GROQ_API_KEY's daily
      # quota is shared with the live app. Run the full set locally for real tuning.
      - name: RAGAS eval-gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python evaluate_chatbot.py --limit 6 --metrics faithfulness,answer_relevancy
          python eval/check_thresholds.py eval/results/summary.json --metrics faithfulness,answer_relevancy

      # GHCR requires lowercase image names, repo name has uppercase letters
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull-and-restart over SSH. App binds 127.0.0.1:8080, not 80 -- Caddy
      # owns 80/443 for HTTPS and isn't touched by this workflow. Don't change
      # this back to -p 80:8080, that port is taken and deploy will fail.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ steps.image.outputs.name }}:latest
            docker stop healthcare-chatbot 2>/dev/null || true
            docker rm healthcare-chatbot 2>/dev/null || true
            # bind mount so feedback survives redeploys
            sudo mkdir -p /opt/healthcare-chatbot/feedback
            sudo chown -R 1000:1000 /opt/healthcare-chatbot/feedback
            docker run -d \
              --name healthcare-chatbot \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              -v /opt/healthcare-chatbot/feedback:/app/eval/feedback \
              -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
              ${{ steps.image.outputs.name }}:latest
            docker image prune -f
